services:
  postgres:
    image: postgres:15-alpine
    container_name: musicpt_postgres
    environment:
      POSTGRES_USER: musicpt_user
      POSTGRES_PASSWORD: musicpt_password
      POSTGRES_DB: musicpt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicpt_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - musicpt_network

  redis:
    image: redis:7-alpine
    container_name: musicpt_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - musicpt_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: musicpt_api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://musicpt_user:musicpt_password@postgres:5432/musicpt_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_ACCESS_TOKEN_EXPIRATION: 15m
      JWT_REFRESH_TOKEN_EXPIRATION: 7d
      RATE_LIMIT_FREE_TIER: 20
      RATE_LIMIT_PAID_TIER: 100
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    command: npm run start:prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - musicpt_network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: musicpt_worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://musicpt_user:musicpt_password@postgres:5432/musicpt_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      QUEUE_NAME: prompt-processing
      QUEUE_CONCURRENCY: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    command: npm run worker
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "-v", "grep", "|", "grep", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - musicpt_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  musicpt_network:
    driver: bridge